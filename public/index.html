<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F4F4F0">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f172a;
    --dim:#475569;
    --panel:#ffffff;
    --panel2:#f4f4f0;
    --line:#cbd5e1;
    --line-strong:#94a3b8;
    --tag:#0f172a;
    --tag-contrast:#ffffff;
    --bg:#f4f4f0;
    --radius:3px;
    --ok-bg:#dcfce7;   --ok-text:#14532d;
    --low-bg:#fffbeb;  --low-text:#92400e;
    --exp-bg:#fee2e2;  --exp-text:#b91c1c;
    --est-bg:#eeeee8;  --est-text:#57534e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  header{
    border-bottom:1px solid var(--ink);
    background:var(--panel);
    padding:20px 28px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand-eyebrow{
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--dim);
    text-transform:uppercase;
    margin-bottom:4px;
    font-weight:600;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--ink);
  }
  .meta-strip{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--dim);
    text-align:right;
    line-height:1.6;
  }
  main{
    max-width:960px;
    margin:0 auto;
    padding:24px;
  }
  .toolbar{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  button{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    font-weight:600;
    background:#ffffff;
    color:var(--ink);
    border:1px solid var(--ink);
    border-radius:var(--radius);
    padding:7px 12px;
    cursor:pointer;
    transition:background 0.1s;
  }
  button.primary{
    background:var(--ink);
    color:var(--tag-contrast);
    border-color:var(--ink);
    font-weight:700;
  }
  button:hover{background:var(--panel2);}
  button.primary:hover{background:#1e293b;}

  .kit{
    background:var(--panel);
    border:1px solid var(--ink);
    border-radius:var(--radius);
    margin-bottom:12px;
  }
  .kit-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    gap:14px;
    flex-wrap:wrap;
  }
  .kit-photo{
    width:56px;
    height:56px;
    object-fit:cover;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--panel2);
    flex-shrink:0;
  }
  .kit-photo-placeholder{
    width:56px;
    height:56px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--panel2);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    color:var(--dim);
    text-align:center;
    letter-spacing:0.04em;
    cursor:pointer;
  }
  .kit-photo-wrap{position:relative; flex-shrink:0;}
  .kit-photo-wrap input[type=file]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }
  .kit-photo-wrap .kit-photo{cursor:pointer;}

  .kit-toggle{
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-top:1px solid var(--line);
    border-radius:0;
    color:var(--dim);
    padding:9px 18px;
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .kit-toggle:hover{color:var(--ink); background:var(--panel2);}
  .items-panel{
    border-top:1px solid var(--line);
    padding:14px 18px 16px;
    display:none;
  }
  .items-panel.open{display:block;}
  .item-row{
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .item-row-main{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .item-name-input{
    flex:1;
    min-width:0;
    font-family:'JetBrains Mono', monospace !important;
    font-size:13px !important;
    font-weight:600;
    padding:6px 8px !important;
  }
  .item-row-actions{display:flex; gap:4px; flex-shrink:0;}
  .item-row-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    margin-top:6px;
    margin-left:42px;
  }
  .item-row-meta label{
    display:flex;
    flex-direction:column;
    gap:2px;
    font-size:9px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--dim);
    font-weight:700;
  }
  .item-row-meta input, .item-row-meta select{width:92px;}
  .item-row-meta .est-field{
    flex-direction:row;
    align-items:center;
    gap:5px;
    align-self:flex-end;
    padding-bottom:5px;
  }
  .search-row{
    display:grid;
    grid-template-columns:1fr 60px 120px 90px;
    gap:6px;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .type-group{
    margin-bottom:12px;
    border:1px solid var(--ink);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .type-group > summary{
    list-style:none;
    cursor:pointer;
    padding:10px 14px;
    background:var(--panel2);
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink);
    border-left:3px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .type-group > summary::-webkit-details-marker{display:none;}
  .type-group > summary::before{content:"▸ "; color:var(--dim);}
  .type-group[open] > summary::before{content:"▾ "; color:var(--dim);}
  .type-group-body{padding:4px 14px 8px;}
  .cat-group{margin-top:4px; border-top:1px dashed var(--line);}
  .cat-group:first-child{border-top:none; margin-top:0;}
  .cat-group > summary{
    list-style:none;
    cursor:pointer;
    padding:9px 2px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--dim);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .cat-group > summary:hover{color:var(--ink);}
  .cat-group > summary::-webkit-details-marker{display:none;}
  .cat-group > summary::before{content:"▸ ";}
  .cat-group[open] > summary::before{content:"▾ ";}
  .group-count{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    font-weight:600;
    color:var(--dim);
    background:var(--panel2);
    border:1px solid var(--line);
    padding:1px 7px;
    border-radius:var(--radius);
  }
  .est-toggle{width:16px; height:16px; cursor:pointer; accent-color:var(--ink);}
  .status-estimate{background:var(--est-bg); color:var(--est-text);}
  .qty-stepper{display:flex; align-items:center; gap:3px;}
  .qty-stepper button{padding:2px 7px; font-size:12px; line-height:1;}
  .qty-stepper input{font-family:'JetBrains Mono', monospace; width:42px !important; text-align:center;}
  .restock-btn{
    background:var(--low-bg); color:var(--low-text); border:1px solid #fcd34d;
    border-radius:var(--radius);
    font-family:'Space Grotesk', sans-serif;
    font-size:10px; font-weight:700; padding:3px 8px; white-space:nowrap;
  }
  .restock-btn:hover{filter:brightness(0.97);}
  .item-photo{
    width:34px;
    height:34px;
    object-fit:cover;
    border:1px solid var(--line);
    border-radius:var(--radius);
    cursor:pointer;
  }
  .item-photo-placeholder{
    width:34px;
    height:34px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--panel2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    color:var(--dim);
    cursor:pointer;
  }
  .item-photo-wrap{position:relative;}
  .item-photo-wrap input[type=file]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }
  .item-row input, .item-row select{
    background:#ffffff;
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    color:var(--ink);
    font-family:inherit;
    font-size:12px;
    padding:5px 6px;
    width:100%;
  }
  .item-row input:focus, .item-row select:focus,
  .item-toolbar input:focus, .item-toolbar select:focus{
    outline:none;
    border-color:var(--ink);
  }
  .status-pill{
    font-family:'Space Grotesk', sans-serif;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.04em;
    padding:3px 8px;
    border-radius:var(--radius);
    text-align:center;
    text-transform:uppercase;
  }
  .status-ok{background:var(--ok-bg); color:var(--ok-text);}
  .status-low{background:var(--low-bg); color:var(--low-text);}
  .status-expiring{background:var(--low-bg); color:var(--low-text);}
  .status-expired{background:var(--exp-bg); color:var(--exp-text);}
  .readiness-badge{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.01em;
    padding:4px 10px;
    border-radius:var(--radius);
    text-transform:uppercase;
    white-space:nowrap;
    align-self:flex-start;
  }
  .readiness-green{background:var(--ok-bg); color:var(--ok-text);}
  .readiness-yellow{background:var(--low-bg); color:var(--low-text);}
  .readiness-red{background:var(--exp-bg); color:var(--exp-text);}
  .overdue-text{color:var(--exp-text);}
  .bulk-add-box{
    margin-top:10px;
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .bulk-add-box textarea{
    flex:1;
    background:#ffffff;
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    padding:8px;
    min-height:60px;
  }
  .bulk-add-box textarea:focus{
    outline:none;
    border-color:var(--ink);
  }
  .item-toolbar{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .item-toolbar input, .item-toolbar select{
    background:#ffffff;
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    color:var(--ink);
    font-family:inherit;
    font-size:12px;
    padding:6px 8px;
  }
  .undo-toast{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .undo-toast button{padding:3px 8px; font-size:11px; background:transparent; color:#fff; border-color:#64748b;}
  .undo-toast button:hover{background:rgba(255,255,255,0.12); border-color:#cbd5e1;}
  .kit-id{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--dim);
    letter-spacing:0.06em;
  }
  .kit-name{
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    font-weight:700;
    background:transparent;
    border:none;
    color:var(--ink);
    padding:2px 0;
    width:100%;
  }
  .kit-name:focus{
    outline:none;
    border-bottom:1px solid var(--ink);
  }
  .kit-actions{display:flex; gap:8px;}
  .kit-body{
    border-top:1px solid var(--line);
    padding:14px 18px 16px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:14px;
    align-items:start;
  }
  .kit-notes{
    font-size:13px;
    color:var(--dim);
    background:transparent;
    border:none;
    resize:vertical;
    min-height:38px;
    width:100%;
    font-family:inherit;
    line-height:1.5;
  }
  .kit-notes:focus{outline:none; color:var(--ink);}
  .kit-status{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    text-align:right;
    color:var(--dim);
    white-space:nowrap;
  }
  .checked-btn{
    display:block;
    margin-top:6px;
    font-size:10px;
    padding:5px 9px;
  }
  .empty{
    border:1px solid var(--ink);
    border-radius:var(--radius);
    padding:32px 24px;
    text-align:center;
    color:var(--dim);
    font-size:13px;
    background:var(--panel);
  }
  .empty b{color:var(--ink); display:block; font-size:15px; margin-bottom:6px; font-weight:700; font-family:'Space Grotesk', sans-serif;}
  .new-kit-row{
    display:flex;
    gap:8px;
    margin-top:16px;
  }
  .new-kit-row input{
    flex:1;
    background:#ffffff;
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    color:var(--ink);
    padding:9px 12px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
  }
  .new-kit-row input:focus{outline:none; border-color:var(--ink);}
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#0f172a;
    color:#ffffff;
    border-radius:var(--radius);
    padding:10px 18px;
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    font-weight:600;
    opacity:0;
    transition:opacity 0.2s;
    pointer-events:none;
    max-width:90vw;
  }
  .toast.show{opacity:1;}
  @media (max-width:520px){
    header{padding:16px;}
    main{padding:16px;}
    .meta-strip{text-align:left;}
    .kit-body{grid-template-columns:1fr;}
    .kit-status{text-align:left;}
  }
</style>
</head>
<body>
<datalist id="category-suggestions">
  <option value="Hemorrhage Control"></option>
  <option value="Airway & Breathing"></option>
  <option value="Splinting & Fractures"></option>
  <option value="Burn Care"></option>
  <option value="Wound Care"></option>
  <option value="PPE"></option>
  <option value="Medications"></option>
  <option value="Environmental"></option>
  <option value="Documentation"></option>
  <option value="Hydration & Nutrition"></option>
  <option value="Tools & Equipment"></option>
</datalist>

<header>
  <div>
    <div class="brand-eyebrow">Chamber Youth Taytung</div>
    <h1>Inventory</h1>
  </div>
  <div class="meta-strip" id="metaStrip">— kits on record</div>
</header>

<main>
  <div class="toolbar">
    <button class="primary" onclick="document.getElementById('newKitInput').focus()">+ Add kit</button>
    <button onclick="loadKits()">Refresh</button>
    <button onclick="showExpiringDashboard()" title="See everything expiring in the next 60 days, across all kits">⏰ Expiring</button>
    <input id="globalSearch" type="text" placeholder="Search items across all kits..." oninput="globalSearch(this.value)" style="flex:1; min-width:200px; background:var(--panel2); border:1px solid var(--line); color:var(--ink); padding:9px 12px; font-family:inherit; font-size:12px;" />
  </div>
  <div id="globalResults"></div>

  <div id="kitList"></div>

  <div class="new-kit-row">
    <input id="newKitInput" type="text" placeholder="New kit name — e.g. Engine 2 Trauma Bag" />
    <button class="primary" onclick="createKit()">Create</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const API = '/.netlify/functions/kits';
const SUPABASE_URL = 'https://ywxvitgrmcxcoptsnxeu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_m1dKr206B8oR3XaPXE986w_x85YP5fZ'; // same anon key as Sheets sync
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadKits(){
  const list = document.getElementById('kitList');
  try{
    const res = await fetch(API);
    const kits = await res.json();
    document.getElementById('metaStrip').textContent =
      kits.length + (kits.length === 1 ? ' kit on record' : ' kits on record');

    if(!kits.length){
      list.innerHTML = '<div class="empty"><b>No kits logged yet</b>Add the first kit below to start the manifest.</div>';
      return;
    }
    allKitsCache = kits;
    list.innerHTML = kits.map(renderKit).join('');
  }catch(e){
    list.innerHTML = '<div class="empty"><b>Manifest unreachable</b>Check that SUPABASE_URL and SUPABASE_ANON_KEY are set in Netlify, then refresh.</div>';
  }
}

function renderKit(k){
  const checked = k.last_checked_at
    ? new Date(k.last_checked_at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})
    : 'never logged';

  const daysSinceCheck = k.last_checked_at
    ? Math.floor((Date.now() - new Date(k.last_checked_at)) / 86400000)
    : null;
  const overdue = daysSinceCheck === null || daysSinceCheck > 30;

  const pct = k.readiness_pct ?? 100;
  const readinessClass = pct >= 90 ? 'readiness-green' : pct >= 60 ? 'readiness-yellow' : 'readiness-red';

  return `
    <div class="kit" data-id="${k.id}">
      <div class="kit-head">
        <div class="kit-photo-wrap">
          ${k.photo_url
            ? `<img class="kit-photo" src="${k.photo_url}" alt="${escapeAttr(k.name)}" />`
            : `<div class="kit-photo-placeholder">ADD<br>PHOTO</div>`}
          <input type="file" accept="image/*" onchange="uploadPhoto('${k.id}', this)" />
        </div>
        <div style="flex:1; min-width:200px;">
          <div class="kit-id">KIT-${k.id.slice(0,8).toUpperCase()}</div>
          <input class="kit-name" value="${escapeAttr(k.name)}" onchange="renameKit('${k.id}', this.value)" />
        </div>
        <span class="readiness-badge ${readinessClass}" title="${k.flagged_items||0} of ${k.total_items||0} items need attention">
          ${pct}% ready
        </span>
        <div class="kit-actions">
          <button onclick="duplicateKit('${k.id}', '${escapeAttr(k.name)}')">Duplicate</button>
          <button onclick="deleteKit('${k.id}')">Remove</button>
        </div>
      </div>
      <div class="kit-body">
        <textarea class="kit-notes" placeholder="Location, owner, contents notes..." onchange="updateNotes('${k.id}', this.value)">${escapeHtml(k.notes || '')}</textarea>
        <div class="kit-status">
          <span class="${overdue ? 'overdue-text' : ''}">
            Last checked: ${checked}${daysSinceCheck !== null ? ` (${daysSinceCheck}d ago)` : ''}
            ${overdue ? ' — overdue for inspection' : ''}
          </span>
          <button class="checked-btn" onclick="logCheck('${k.id}')">Log inspection</button>
          <button class="checked-btn" onclick="viewCheckHistory('${k.id}', '${escapeAttr(k.name)}')">History</button>
        </div>
      </div>
      <button class="kit-toggle" onclick="toggleItems('${k.id}')" id="toggle-${k.id}">▸ Show items</button>
      <div class="items-panel" id="items-${k.id}"></div>
    </div>`;
}

async function logCheck(kitId){
  const checkedBy = prompt('Your name (for the log):', localStorage.getItem('jk_checked_by') || '');
  if(checkedBy === null) return;
  localStorage.setItem('jk_checked_by', checkedBy);
  const notes = prompt('Notes for this check (optional):', '') || '';

  const res = await fetch('/.netlify/functions/checks', {
    method: 'POST',
    body: JSON.stringify({ kit_id: kitId, checked_by: checkedBy, notes })
  });
  const result = await res.json();
  showToast(`Logged: ${result.items_ok} ok, ${result.items_flagged} flagged`);
  loadKits();
  if(openPanels[kitId]) loadItems(kitId);
}

async function viewCheckHistory(kitId, kitName){
  const res = await fetch(`/.netlify/functions/checks?kit_id=${kitId}`);
  const checks = await res.json();
  if(!checks.length){
    alert(`No inspections logged yet for ${kitName}.`);
    return;
  }
  const lines = checks.map(c => {
    const date = new Date(c.checked_at).toLocaleString();
    return `${date} — ${c.checked_by || 'unknown'} — ${c.items_ok} ok / ${c.items_flagged} flagged${c.notes ? ' — ' + c.notes : ''}`;
  });
  alert(`Inspection history for ${kitName}:\n\n${lines.join('\n')}`);
}

let allKitsCache = [];
let openPanels = {};
let itemFilters = {}; // per kit: {sort, category, status}
let lastDeleted = null;
let itemsCache = {}; // per kit: last loaded items array, used by CSV export

function toggleItems(kitId){
  const panel = document.getElementById('items-'+kitId);
  const btn = document.getElementById('toggle-'+kitId);
  const isOpen = panel.classList.toggle('open');
  openPanels[kitId] = isOpen;
  btn.textContent = isOpen ? '▾ Hide items' : '▸ Show items';
  if(isOpen) loadItems(kitId);
}

async function loadItems(kitId){
  const panel = document.getElementById('items-'+kitId);
  panel.innerHTML = 'Loading...';
  const res = await fetch(`/.netlify/functions/items?kit_id=${kitId}`);
  let items = await res.json();
  itemsCache[kitId] = items;

      <div style="display:flex; flex-direction:column; gap:6px;">
        <button class="primary" onclick="bulkAdd('${kitId}')">Add all</button>

// Groups items into DURABLE EQUIPMENT / CONSUMABLE SUPPLIES, then by
// category within each, as collapsible <details> sections.
function renderGroupedItems(kitId, items){
  const TYPE_LABELS = { durable: 'Durable Equipment', consumable: 'Consumable Supplies' };
  const order = ['durable', 'consumable'];
  const groups = { durable: {}, consumable: {} };

  items.forEach(i => {
    const type = i.item_type === 'durable' ? 'durable' : 'consumable';
    const cat = i.category || 'Uncategorized';
    (groups[type][cat] = groups[type][cat] || []).push(i);
  });

  return order.map(type => {
    const cats = Object.keys(groups[type]).sort();
    if(!cats.length) return '';
    const total = cats.reduce((sum, c) => sum + groups[type][c].length, 0);
    return `
      <details class="type-group" open>
        <summary>${TYPE_LABELS[type]} <span class="group-count">${total}</span></summary>
        <div class="type-group-body">
          ${cats.map(cat => `
            <details class="cat-group" open>
              <summary>${escapeHtml(cat)} <span class="group-count">${groups[type][cat].length}</span></summary>
              ${groups[type][cat].map(i => renderItemRow(kitId, i)).join('')}
            </details>
          `).join('')}
        </div>
      </details>`;
  }).join('');
}

// Re-encodes any picked photo (BMP, HEIC, giant camera JPEGs, whatever) into
// a standard, size-capped JPEG before it ever reaches Supabase Storage.
// This is what actually fixes uploads: some source formats (BMP especially)
// get rejected outright, and even accepted formats can be huge uncompressed
// camera files that hit storage size limits.
function loadImageFromFile(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
async function normalizePhotoForUpload(file, maxDim = 1600, quality = 0.82){
  const img = await loadImageFromFile(file);
  let { width, height } = img;
  if(width > maxDim || height > maxDim){
    const scale = maxDim / Math.max(width, height);
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('Could not convert image')), 'image/jpeg', quality);
  });
}

async function uploadItemPhoto(kitId, itemId, input){
  const file = input.files[0];
  if(!file) return;
  showToast('Processing photo...');
  let uploadBlob, ext = 'jpg';
  try {
    uploadBlob = await normalizePhotoForUpload(file);
  } catch(convertErr){
    console.warn('Could not re-encode image, uploading original as-is:', convertErr);
    uploadBlob = file;
    ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  }
  const path = `item-${itemId}-${Date.now()}.${ext}`;

  showToast('Uploading photo...');
  const { error: uploadErr } = await sb.storage.from('kit-photos').upload(path, uploadBlob, { upsert: true, contentType: uploadBlob.type || 'image/jpeg' });
  if(uploadErr){
    console.error('Item photo upload failed:', uploadErr);
    showToast('Upload failed: ' + (uploadErr.message || 'see console'));
    return;
  }
  const { data } = sb.storage.from('kit-photos').getPublicUrl(path);
  await fetch('/.netlify/functions/items', {method:'POST', body: JSON.stringify({action:'update', id: itemId, photo_url: data.publicUrl})});
  showToast('Photo saved');
  loadItems(kitId);
}

  lastDeleted = {kitId, itemId};

function showUndoToast(msg, onUndo){
  const t = document.getElementById('toast');
  t.innerHTML = '';
  const span = document.createElement('span');
  span.className = 'undo-toast';
  span.appendChild(document.createTextNode(msg + ' '));
  const btn = document.createElement('button');
  btn.textContent = 'Undo';
  btn.onclick = onUndo; // real closure — no more broken .toString() re-execution
  span.appendChild(btn);
  t.appendChild(span);
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 4000);
}

function adjustQty(kitId, itemId, current, delta){

function restockItem(kitId, itemId, threshold){
  const suggested = Math.max(threshold * 3, threshold + 5, 10);
  const val = prompt('Quantity after restocking:', suggested);

  const qty = parseInt(val, 10);
  if(isNaN(qty) || qty < 0) return;
  updateItem(kitId, itemId, 'quantity', qty);
}

// --- CSV export / import ---
function csvEscape(v){
  if(v === null || v === undefined) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const CSV_HEADERS = ['name','quantity','category','item_type','low_stock_threshold','expires_at','pack_size','lot_number','condition','estimate_only'];

function exportCSV(kitId){
  const items = itemsCache[kitId] || [];
  if(!items.length){ showToast('Nothing to export yet'); return; }
  const kit = allKitsCache.find(k => k.id === kitId);
  const rows = items.map(i => CSV_HEADERS.map(h => csvEscape(i[h])).join(','));
  const csv = [CSV_HEADERS.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(kit?.name || 'kit').replace(/[^a-z0-9]/gi,'_')}_items.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function splitCSVLine(line){
  const result = []; let cur = ''; let inQuotes = false;
  for(let i=0; i<line.length; i++){
    const c = line[i];
    if(inQuotes){
      if(c === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; } else inQuotes = false;
      } else cur += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ result.push(cur); cur = ''; }
      else cur += c;
    }
  }
  result.push(cur);
  return result;
}
function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if(!lines.length) return [];
  const headers = splitCSVLine(lines[0]).map(h => h.trim());
  return lines.slice(1).map(line => {
    const cells = splitCSVLine(line);
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (cells[idx] || '').trim(); });
    return obj;
  });
}

async function importCSV(kitId, input){
  const file = input.files[0];
  if(!file) return;
  const text = await file.text();
  const rows = parseCSV(text).filter(r => r.name);
  input.value = '';
  if(!rows.length){ showToast('No valid rows found in that CSV'); return; }
  showToast('Importing & categorizing...');
  const res = await fetch('/.netlify/functions/items', {method:'POST', body: JSON.stringify({action:'csv_import', kit_id: kitId, rows})});
  const result = await res.json();
  const parts = [];
  if(result.inserted) parts.push(`${result.inserted} new`);
  if(result.merged) parts.push(`${result.merged} merged into existing`);
  showToast(parts.length ? parts.join(', ') : (result.error || 'Import failed'));
  loadItems(kitId);
}

// --- Voice-to-bulk-add ---
function voiceBulkAdd(kitId){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRec){ showToast('Voice input not supported in this browser'); return; }
  const rec = new SpeechRec();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  showToast('Listening...');
  rec.onresult = (e) => {
    const heard = e.results[0][0].transcript;
    // Split "gauze pads, tourniquet and gloves" into separate list lines.
    const parts = heard.split(/,| and /i).map(s => s.trim()).filter(Boolean);
    const ta = document.getElementById('bulk-'+kitId);
    ta.value = ta.value ? ta.value + '\n' + parts.join('\n') : parts.join('\n');
    showToast('Heard: ' + heard);
  };
  rec.onerror = (e) => showToast('Voice error: ' + e.error);
  rec.start();
}

async function showExpiringDashboard(){

  results.innerHTML = 'Loading...';

  const items = await res.json();
  const now = Date.now();
  const upcoming = items
    .filter(i => i.expires_at)
    .map(i => ({...i, daysLeft: Math.floor((new Date(i.expires_at) - now) / 86400000)}))
    .filter(i => i.daysLeft <= 60)
    .sort((a,b) => a.daysLeft - b.daysLeft);

  if(!upcoming.length){
    results.innerHTML = '<div class="empty" style="margin-bottom:16px;">Nothing expired or expiring in the next 60 days.</div>';
    return;
  }
  results.innerHTML = `<div class="kit" style="margin-bottom:16px;"><div class="kit-body" style="grid-template-columns:1fr; padding-top:14px;">
    <div style="font-size:11px; color:var(--dim); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.06em;">Expiring within 60 days — across all kits</div>
    ${upcoming.map(i => `<div class="search-row">
      <span>${escapeHtml(i.name)}</span>
      <span style="color:var(--dim); font-size:11px;">${escapeHtml(i.kits?.name || '')}</span>
      <span style="color:${i.daysLeft < 0 ? '#b91c1c' : i.daysLeft <= 14 ? '#92400e' : 'var(--dim)'}; font-family:'JetBrains Mono', monospace; font-weight:600;">${i.daysLeft < 0 ? `Expired ${Math.abs(i.daysLeft)}d ago` : `${i.daysLeft}d left`}</span>
      <span class="status-pill status-${i.status}">${i.status}</span>
    </div>`).join('')}
  </div></div>`;
}

  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){
  return escapeHtml(s).replace(/"/g,'&quot;');
}

loadKits();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((err) => console.error('SW registration failed:', err));
  });
}
</script>
